query Conversations {
  conversations {
    id
    users {
      id
      username
    }
    messages {
      id
      content
      author {
        id
        username
      }
    }
  }
}

query Conversation($id: Int!) {
  conversation(id: $id) {
    id
    users {
      id
      username
    }
    messages {
      id
      content
      author {
        id
        username
      }
    }
  }
}

mutation CreateConversation($userIds: [Int!]!) {
  createConversation(userIds: $userIds) {
    id
    users {
      id
      username
    }
    messages {
      id
      content
    }
  }
}

mutation SendMessage($input: SendMessageInput!) {
  sendMessage(input: $input)
}
